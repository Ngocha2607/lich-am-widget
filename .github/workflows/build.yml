name: Build APK

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Giữ v5: từ v6 phần cache của setup-gradle không còn mã nguồn mở
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Kiểm tra thuật toán lịch âm
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LichThoiTiet.apk

      # Nhánh nào cũng có APK để tải trong tab Actions (mục Artifacts)
      - uses: actions/upload-artifact@v7
        with:
          name: LichThoiTiet-apk
          path: LichThoiTiet.apk

      # Chỉ nhánh main mới tạo Release (tải APK trực tiếp trên điện thoại, không phải giải nén zip)
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: LichThoiTiet.apk
