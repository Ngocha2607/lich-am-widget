name: Build APK

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Kiểm tra thuật toán lịch âm
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LichThoiTiet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LichThoiTiet-apk
          path: LichThoiTiet.apk

      # Tạo Release để tải APK trực tiếp trên điện thoại (không phải giải nén zip)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bản build ${{ github.run_number }}
          files: LichThoiTiet.apk
